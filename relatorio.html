<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>DevTech - Inscrição Confirmada</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

          <script>
        const supabaseClient = supabase.createClient(
            "https://chcshzruympfsqxqzfay.supabase.co",
            "sb_publishable_fvrhSvXEV0KrY1UqWI88kQ_Hcqs5RYT"
        );
    </script>

</head>

<style>
    .dashboard-container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 20px;
}

.dashboard-header {
    margin-bottom: 30px;
}

.dashboard-header h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.dashboard-header p {
    color: #666;
}

.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.card-metrica {
    flex: 1;
    min-width: 220px;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.card-metrica h3 {
    font-size: 40px;
    margin-bottom: 10px;
    color: #6c63ff;
}

.card-metrica span {
    color: #666;
}

.tabela-container {
    overflow-x: auto;
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: #111827;
    color: white;
}

th, td {
    padding: 16px;
    text-align: left;
}

tbody tr {
    border-bottom: 1px solid #eee;
    transition: 0.2s;
}

tbody tr:hover {
    background: #f5f7ff;
}

.btn-voltar {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 24px;
    background: #6c63ff;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    transition: 0.2s;
}

.btn-voltar:hover {
    opacity: 0.9;
}
</style>

<body>

<nav>
    <a href="index.html">Início</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="eventos.html">Eventos</a>
</nav>

<section class="hero hero-geral">
    <div class="hero-text">
        <h1>Relatório de Inscritos</h1>
    </div>
</section>

<div class="dashboard-container">

    <div class="dashboard-header">

        <h2>Dashboard de Inscrições</h2>

        <p>
            Acompanhe os participantes cadastrados no evento DevTech.
        </p>

    </div>

    <div class="cards">

        <div class="card-metrica">
            <h3 id="totalInscritos">0</h3>
            <span>Total de inscritos</span>
        </div>

        <div class="card-metrica">
            <h3 id="totalAreas">0</h3>
            <span>Áreas diferentes</span>
        </div>

    </div>

    <div class="tabela-container">

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Área</th>
                </tr>
            </thead>

            <tbody id="tabelaInscritos"></tbody>

        </table>

    </div>

    <a href="index.html" class="btn-voltar">
        Voltar para o início
    </a>

</div>

<footer>
    © 2026 DevTech
</footer>

<script>

    async function carregarInscritos() {

        const { data, error } = await supabaseClient
            .from("Cadastro")
            .select("*");

        console.log(data);
        console.log(error);

        if (error) {

            console.error(error);

            alert(error.message);

            return;
        }

        const tabela = document.getElementById("tabelaInscritos");

        tabela.innerHTML = "";

        data.forEach(inscrito => {

            tabela.innerHTML += `
                <tr>
                    <td>${inscrito.nome ?? ""}</td>
                    <td>${inscrito.email ?? ""}</td>
                    <td>${inscrito.telefone ?? ""}</td>
                    <td>${inscrito.atuacao ?? ""}</td>
                </tr>
            `;
        });

        document.getElementById("totalInscritos").innerText = data.length;

        const areas = [...new Set(data.map(i => i.atuacao))];

        document.getElementById("totalAreas").innerText = areas.length;
    }

    carregarInscritos();

</script>

</body>
</html>

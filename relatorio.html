<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Relatório de Inscritos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body>

    <h1>Inscritos no Evento</h1>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Área</th>
            </tr>
        </thead>

        <tbody id="tabelaInscritos"></tbody>

    </table>

    <script>



        const supabaseClient = supabase.createClient(
            "https://chcshzruympfsqxqzfay.supabase.co",
            "SUA_CHAVE"
        );

        async function carregarInscritos() {

            const { data, error } = await supabaseClient
                .from("Cadastro")
                .select("*");

            if (error) {

                console.error(error);

                alert(error.message);

                return;
            }

            const tabela = document.getElementById("tabelaInscritos");

            data.forEach(inscrito => {

                tabela.innerHTML += `
                    <tr>
                        <td>${inscrito.nome}</td>
                        <td>${inscrito.email}</td>
                        <td>${inscrito.telefone}</td>
                        <td>${inscrito.atuacao}</td>
                    </tr>
                `;
            });

        }

        carregarInscritos();

    </script>

</body>

</html>

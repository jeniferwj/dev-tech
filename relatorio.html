<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>DevTech - Inscrição Confirmada</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<nav>
    <a href="index.html">Início</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="eventos.html">Eventos</a>
</nav>

<section class="hero hero-geral">
    <div class="hero-text">
        <h1>Relatório de Inscritos</h1>
    </div>
</section>

<div class="sucesso-container">

    <h1>Inscritos no Evento</h1>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Área</th>
            </tr>
        </thead>

        <tbody id="tabelaInscritos"></tbody>

    </table>

    <script>

        const supabaseClient = supabase.createClient(
            "https://chcshzruympfsqxqzfay.supabase.co",
            "sb_publishable_fvrhSvXEV0KrY1UqWI88kQ_Hcqs5RYT"
        );

        async function carregarInscritos() {

            const { data, error } = await supabaseClient
                .from("Cadastro")
                .select("*");

            console.log(data);
            console.log(error);

            if (error) {

                console.error(error);

                alert(error.message);

                return;
            }

            const tabela = document.getElementById("tabelaInscritos");

            tabela.innerHTML = "";

            data.forEach(inscrito => {

                tabela.innerHTML += `
                    <tr>
                        <td>${inscrito.nome ?? ""}</td>
                        <td>${inscrito.email ?? ""}</td>
                        <td>${inscrito.telefone ?? ""}</td>
                        <td>${inscrito.atuacao ?? ""}</td>
                    </tr>
                `;
            });

        }

        carregarInscritos();

    </script>



    <a href="index.html" class="btn-voltar">
        Voltar para o início
    </a>

</div>

<footer>
    © 2026 DevTech
</footer>

</body>
</html>

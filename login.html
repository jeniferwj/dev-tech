<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - DevTech</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="eventos.html">Eventos</a>
    <a href="login.html" class="active">Login</a>
  </nav>

  <section class="login-section">
    <div class="login-container">
      <h2>Login Administrativo</h2>
      <p>Digite o usuário e senha para acessar o sistema</p>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Usuário</label>
          <input type="text" id="email" name="email" required placeholder="Digite o usuário">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required placeholder="Digite a senha">
        </div>

        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i>
          Entrar
        </button>
      </form>

      <div class="login-links">
        <a href="#" id="forgotPassword">Ver credenciais de acesso</a>
      </div>
    </div>
  </section>

  <script src="assets/js/script.js"></script>

</body>

<footer>
    © 2026 DevTech
</footer>

</html>
